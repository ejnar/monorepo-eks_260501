server:
  port: 8080

spring:
  application:
    name: service-a
  datasource:
    url: jdbc:h2:mem:serviceadb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

aws:
  region: ${AWS_REGION:us-east-1}
  secrets:
    enabled: ${AWS_SECRETS_ENABLED:false}

logging:
  level:
    com.example: INFO
    root: WARN
