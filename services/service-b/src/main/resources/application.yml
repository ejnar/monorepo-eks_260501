server:
  port: 8081

spring:
  application:
    name: service-b
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

aws:
  region: ${AWS_REGION:us-east-1}
  secrets:
    enabled: ${AWS_SECRETS_ENABLED:false}

logging:
  level:
    com.example: INFO
    root: WARN
